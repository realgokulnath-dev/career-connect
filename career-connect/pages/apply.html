<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Apply Job</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="../css/style.css">

</head>

<body>

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a href="../index.html"
                class="navbar-brand">

                CareerConnect

            </a>

        </div>

    </nav>

    <section class="py-5">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-6">

                    <div class="card shadow">

                        <div class="card-body">

                            <h2 class="text-center mb-4">

                                Job Application Form

                            </h2>

                            <form id="jobForm">

                                <div class="mb-3">

                                    <label class="form-label">
                                        Full Name
                                    </label>

                                    <input
                                        type="text"
                                        id="name"
                                        class="form-control">

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">
                                        Email
                                    </label>

                                    <input
                                        type="email"
                                        id="email"
                                        class="form-control">

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">
                                        Phone
                                    </label>

                                    <input
                                        type="tel"
                                        id="phone"
                                        class="form-control">

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">
                                        Resume
                                    </label>

                                    <input
                                        type="file"
                                        class="form-control">

                                </div>

                                <button
                                    type="submit"
                                    class="btn btn-primary w-100">

                                    Submit Application

                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <script src="../js/app.js"></script>

</body>

</html>
