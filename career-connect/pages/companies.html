<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Companies</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="../css/style.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a href="../index.html"
                class="navbar-brand">

                CareerConnect

            </a>

        </div>

    </nav>

    <!-- Heading -->

    <section class="py-5 bg-light">

        <div class="container text-center">

            <h1 class="fw-bold">

                Top Hiring Companies

            </h1>

            <p>

                Explore companies currently hiring.

            </p>

        </div>

    </section>

    <!-- Companies -->

    <section class="py-5">

        <div class="container">

            <div class="row g-4">

                <!-- Company 1 -->

                <div class="col-md-6 col-lg-3">

                    <div class="card shadow-sm h-100 company-card">

                        <div class="card-body text-center">

                            <h4>Zoho</h4>

                            <p>
                                Software Company
                            </p>

                            <span
                                class="badge bg-success">

                                12 Openings

                            </span>

                        </div>

                    </div>

                </div>

                <!-- Company 2 -->

                <div class="col-md-6 col-lg-3">

                    <div class="card shadow-sm h-100 company-card">

                        <div class="card-body text-center">

                            <h4>TCS</h4>

                            <p>
                                IT Services
                            </p>

                            <span
                                class="badge bg-primary">

                                25 Openings

                            </span>

                        </div>

                    </div>

                </div>

                <!-- Company 3 -->

                <div class="col-md-6 col-lg-3">

                    <div class="card shadow-sm h-100 company-card">

                        <div class="card-body text-center">

                            <h4>Infosys</h4>

                            <p>
                                Technology Solutions
                            </p>

                            <span
                                class="badge bg-warning">

                                18 Openings

                            </span>

                        </div>

                    </div>

                </div>

                <!-- Company 4 -->

                <div class="col-md-6 col-lg-3">

                    <div class="card shadow-sm h-100 company-card">

                        <div class="card-body text-center">

                            <h4>Wipro</h4>

                            <p>
                                Global IT Company
                            </p>

                            <span
                                class="badge bg-danger">

                                15 Openings

                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <script src="../js/app.js"></script>

</body>

</html>
